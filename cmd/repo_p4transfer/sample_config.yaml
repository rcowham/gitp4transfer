# Sample configuration for repo_p4transfer
# This file defines filtering and P4 target settings

# Date range for filtering commits (format: YYYY-MM-DD)
date_range:
  start_date: "2024-01-01"
  end_date: "2024-12-31"

# Branch patterns to include (supports * wildcard)
# If empty, all branches are included
branches:
  - "main"
  - "develop"
  - "android*-release"
  - "master"

# P4 target configuration
# The import_depot is where repos will be imported under their manifest paths
import_depot: "//depot/android_import"
import_path: "android"
default_branch: "main"

# Optional: appended to every changelist description (--native-git only).
# Go text/template syntax; available variables: repo_path, commitid, user.
changelist_description_template: |
  Imported from {{.repo_path}} at Git commit {{.commitid}} by {{.user}}

# Optional: Specify which repos to import from the manifest
# If empty or omitted, all repos from the manifest are imported
selected_repos: []

# Type mappings for P4 filetypes (optional)
typemaps:
  - "binary .exe"
  - "binary .zip"
  - "text .java"
  - "text .xml"

# Git fast-export configuration
# These options control how git fast-export handles edge cases
git_export:
  # How to handle tags pointing to filtered objects (e.g., commits before date range)
  # Options: abort (stop), drop (remove tags), rewrite (dereference tags)
  # Recommended: "drop" for date-filtered imports
  tag_of_filtered_object: "drop"
  
  # How to handle GPG-signed tags
  # Options: verbatim, warn-verbatim, warn-strip, strip, abort
  # Recommended: "warn-strip" for P4 import (P4 doesn't support GPG signatures)
  signed_tags: "warn-strip"
  
  # Enable done marker for resumable exports (advanced feature)
  # Allows resuming interrupted fast-export operations
  use_done_feature: false
  
  # Follow only the first parent commit upon seeing a merge commit in git log
  # Useful for following mainline integration history and excluding topic branch commits
  first_parent: false

